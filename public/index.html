<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventario</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Casa</p>
      <h1>Inventario</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Vanilla JS · Mongo</p><h1>Inventario</h1><p id="low-count"></p></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <form id="item-form" class="card form">
        <input id="name" placeholder="Producto" maxlength="60" required />
        <input id="qty" type="number" min="0" value="1" />
        <input id="min" type="number" min="0" value="1" placeholder="Minimo" />
        <input id="place" placeholder="Lugar" maxlength="24" />
        <button class="primary" type="submit">Agregar</button>
      </form>
      <p id="form-error" class="error" hidden></p>
      <div class="tools"><input id="search" type="search" placeholder="Buscar" /><button id="low-only" class="ghost" type="button">Solo bajos</button></div>
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
